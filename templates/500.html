<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bir şeyler ters gitti · Kararsızım</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF9FF;
      color: #16143A;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .box { max-width: 420px; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { color: #6B6890; margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: #5B3DF5;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Bir şeyler ters gitti</h1>
    <p>Sayfa yüklenirken beklenmedik bir hata oluştu. Az sonra tekrar dene.</p>
    <a href="/">Ana sayfaya dön</a>
  </div>
</body>
</html>
