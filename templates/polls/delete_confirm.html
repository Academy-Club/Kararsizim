{% extends "base.html" %}

{% block title %}Anketi sil · Kararsızım{% endblock %}

{% block content %}
<main class="auth-page">
  <h1>Anketi sil</h1>
  <p>"{{ poll.question }}" anketini silmek üzeresin. Bu işlem geri alınamaz.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn--primary">Evet, sil</button>
    <a class="btn btn--secondary" href="{{ poll.get_absolute_url }}">Vazgeç</a>
  </form>
</main>
{% endblock %}
