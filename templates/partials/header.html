<header class="site-header">
  <a class="site-header__logo" href="{% url 'polls:index' %}">Kararsızım</a>
  <nav class="site-header__nav">
    {% if user.is_authenticated %}
      <span class="site-header__user">@{{ user.username }}</span>
      <a class="btn btn--primary" href="/anket/olustur/">Anket oluştur</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn--secondary">Çıkış yap</button>
      </form>
    {% else %}
      <a class="btn btn--secondary" href="{% url 'accounts:login' %}">Giriş yap</a>
      <a class="btn btn--primary" href="{% url 'accounts:register' %}">Kayıt ol</a>
    {% endif %}
  </nav>
</header>
